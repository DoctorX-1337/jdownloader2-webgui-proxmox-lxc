<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>JDownloader 2 Erweiterung</title><link rel="stylesheet" href="options.css"></head><body><main><img src="icons/icon-192.png" alt=""><h1>JDownloader 2</h1><p>Click’n’Load und Links aus dem Kontextmenü direkt an dein lokales Downloadportal senden.</p><form><label>Portal-Adresse<input id="server" type="url" required placeholder="http://jdownloader2"></label><label>Erweiterungsschlüssel<input id="token" type="password" required autocomplete="off"></label><button>Speichern & Verbindung prüfen</button></form><div id="status" role="status"></div><p class="hint">Den Schlüssel findest du im Downloadportal unter <strong>Einstellungen → Browser-Erweiterung</strong>. Firefox fragt beim Speichern einmal nach Zugriff auf die eingetragene Portal-Adresse.</p></main><script src="options.js"></script></body></html>

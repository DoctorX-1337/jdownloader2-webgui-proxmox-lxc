# Proxy metadata is accepted only from explicitly configured upstream proxies.
# The local trust file contains one trusted IP/CIDR followed by "1;".
geo $jd_trusted_proxy {
    default 0;
    include /etc/nginx/jdownloader-trusted-proxies.d/reverse-proxy.conf;
}
map "$jd_trusted_proxy:$http_x_forwarded_proto" $jd_forwarded_scheme {
    default $scheme;
    "1:https" https;
    "1:http" http;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name jdownloader2 jdownloader.fritz.box 192.0.2.20;
    root /opt/jdownloader-web/frontend/dist;
    index index.html;
    client_max_body_size 64k;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location /api/ {
        # Only the confirmed DLC endpoint accepts larger request bodies.
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $jd_forwarded_scheme;
        proxy_read_timeout 100s;
        add_header Cache-Control "no-store" always;
        access_log off;
    }
    location = /api/downloads/dlc {
        client_max_body_size 14m;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $jd_forwarded_scheme;
        proxy_read_timeout 100s;
        add_header Cache-Control "no-store" always;
        access_log off;
    }
    location = /jdownloader2-firefox-extension.xpi {
        types { application/x-xpinstall xpi; }
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }
    location /assets/ { expires 7d; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name jdownloader2 jdownloader.fritz.box 192.0.2.20;
    root /opt/jdownloader-web/frontend/dist;
    index index.html;
    client_max_body_size 64k;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 100s;
        add_header Cache-Control "no-store" always;
        access_log off;
    }
    location /assets/ { expires 7d; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
